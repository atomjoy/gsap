<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scroll Trigger Video with Text</title>
  <style>
    body { margin: 0; background: #000; color: #fff; font-family: sans-serif; }
    
    /* Spacer sections to demonstrate scrolling before/after */
    .spacer { height: 100vh; display: flex; align-items: center; justify-content: center; background: #111; }
    
    /* Main container holding the video and pinned text */
    .scroll-container { position: relative; width: 100%; height: 400vh; }
    
    /* Fixed background video wrapper */
    .video-wrapper { position: sticky; top: 0; left: 0; width: 100%; height: 100vh; overflow: hidden; z-index: 1; }
    video { width: 100%; height: 100%; object-fit: cover; }

    /* Foreground content overlaying the video */
    .text-overlay { position: relative; z-index: 2; width: 100%; top: -100vh; }
    
    /* Each individual text panel */
    .text-section { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transform: translateY(50px); text-align: center; padding: 0 20px; }
    h2 { font-size: 3rem; margin-bottom: 10px; }
    p { font-size: 1.5rem; max-width: 600px; color: #ccc; }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js" integrity="sha512-oJ8QbaQThQoJZ7oEv+29jfPM6CcP+zUxh3PKJs1vyOhx0UraUrE7PQgeItu3dOuCJyrzWpoYMsVjkkPEBzbUqw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/Observer.min.js" integrity="sha512-28pasLrvjfeQ4EOKQVk6Iihr5mAlO0XhAfbbSgmXT711p3e20uZQRPjcaWt7PXNaNmp9tI67S66K+l38/x8ZCQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/ScrollTrigger.min.js" integrity="sha512-OaIE7ud4P04EhnBuhEcm0wQSceIxbi2pV03oBLS/+F6ampfxsnxcIxOp7H2eF9G7N0kEht0VAzOLG+dTLSo17Q==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

</head>
<body>

  <div class="spacer"><h1>Scroll Down to Begin</h1></div>

  <!-- Main Interactive Block -->
  <div class="scroll-container">
    
    <!-- Pinned Background Video -->
    <div class="video-wrapper">
      <video id="my-video" src="https://www.apple.com/media/us/mac-pro/2013/16C1b6b5-1d91-4fef-891e-ff2fc1c1bb58/videos/macpro_main_desktop.mp4" muted playsinline preload="auto"></video>
    </div>

    <!-- Scrolling Text Overlay -->
    <div class="text-overlay">
      <section class="text-section text-1">
        <h2>Cinematic Design</h2>
        <p>The video advances precisely with your scroll footprint.</p>
      </section>
      <section class="text-section text-2">
        <h2>Perfect Synchronization</h2>
        <p>Animations trigger exactly when they hit the viewport.</p>
      </section>
      <section class="text-section text-3">
        <h2>Interactive Storytelling</h2>
        <p>Combine copy and motion graphics effortlessly with GSAP.</p>
      </section>
    </div>

  </div>

  <div class="spacer"><h1>End of Experience</h1></div>
  
  <script>
    gsap.registerPlugin(ScrollTrigger);

    const video = document.querySelector("#my-video");

    video.addEventListener("loadedmetadata", () => {
      // 1. Timeline to control video timeline scrub
      const tl = gsap.timeline({
        scrollTrigger: {
          trigger: ".scroll-container",
          start: "top top",
          end: "bottom bottom",
          scrub: true,
        }
      });

      // Scrub the video progress through the timeline
      tl.to(video, { currentTime: video.duration, ease: "none" }, 0);

      // 2. Animate nested text elements at specific intervals
      const sections = gsap.utils.toArray(".text-section");
      sections.forEach((section, index) => {
        gsap.to(section, {
          opacity: 1,
          y: 0,
          scrollTrigger: {
            trigger: section,
            start: "top 60%",
            end: "top 20%",
            scrub: true,
            toggleActions: "play reverse play reverse"
          }
        });
        
        // Fade out old text as next section approaches (except for final text)
        if (index < sections.length - 1) {
          gsap.to(section, {
            opacity: 0,
            y: -50,
            scrollTrigger: {
              trigger: sections[index + 1],
              start: "top 90%",
              end: "top 60%",
              scrub: true
            }
          });
        }
      });
    });
  </script>
</body>
</html>
