<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fixed Reverse Scroll Lag - GSAP Video & Text</title>
  <style>
    body { margin: 0; background: #000; color: #fff; font-family: sans-serif; }
    
    .spacer { height: 100vh; display: flex; align-items: center; justify-content: center; background: #111; }
    
    .scroll-container { position: relative; width: 100%; height: 400vh; }
    
    /* Video fixed to screen */
    .video-wrapper { position: sticky; top: 0; left: 0; width: 100%; height: 100vh; overflow: hidden; z-index: 1; }
    video { width: 100%; height: 100%; object-fit: cover; }

    /* Absolute overlay allowing natural text flow */
    .text-overlay { position: absolute; top: 0; left: 0; z-index: 2; width: 100%; height: 100%; }
    
    /* Initial states handled directly via GSAP to prevent flash of unstyled content */
    .text-section { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 20px; box-sizing: border-box; }
    h2 { font-size: 3rem; margin-bottom: 10px; text-shadow: 0 4px 10px rgba(0,0,0,0.9); }
    p { font-size: 1.5rem; max-width: 600px; color: #ccc; text-shadow: 0 2px 5px rgba(0,0,0,0.9); }
  </style>
</head>
<body>

  <div class="spacer"><h1>Scroll Down to Begin</h1></div>

  <div class="scroll-container">
    
    <div class="video-wrapper">
      <video id="my-video" src="https://www.apple.com/media/us/mac-pro/2013/16C1b6b5-1d91-4fef-891e-ff2fc1c1bb58/videos/macpro_main_desktop.mp4" muted playsinline preload="auto"></video>
    </div>

    <div class="text-overlay">
      <section class="text-section" data-time="0">
        <h2>Scene One: The Origin</h2>
        <p>This text stays fully visible in the viewport sweet-spot.</p>
      </section>
      <section class="text-section" data-time="3">
        <h2>Scene Two: Progression</h2>
        <p>Transitions instantly when scrolling down or back up.</p>
      </section>
      <section class="text-section" data-time="6">
        <h2>Scene Three: The Climax</h2>
        <p>Perfect symmetry regardless of your scrolling direction.</p>
      </section>
    </div>

  </div>

  <div class="spacer"><h1>End of Experience</h1></div>

  <!-- CDN Plugins -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js" integrity="sha512-oJ8QbaQThQoJZ7oEv+29jfPM6CcP+zUxh3PKJs1vyOhx0UraUrE7PQgeItu3dOuCJyrzWpoYMsVjkkPEBzbUqw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/Observer.min.js" integrity="sha512-28pasLrvjfeQ4EOKQVk6Iihr5mAlO0XhAfbbSgmXT711p3e20uZQRPjcaWt7PXNaNmp9tI67S66K+l38/x8ZCQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/ScrollTrigger.min.js" integrity="sha512-OaIE7ud4P04EhnBuhEcm0wQSceIxbi2pV03oBLS/+F6ampfxsnxcIxOp7H2eF9G7N0kEht0VAzOLG+dTLSo17Q==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  
  <script>
    gsap.registerPlugin(ScrollTrigger);

    const video = document.querySelector("#my-video");
    const sections = gsap.utils.toArray(".text-section");

    video.addEventListener("loadedmetadata", () => {
      
      sections.forEach((section) => {
        const targetTime = parseFloat(section.getAttribute("data-time"));

        // 1. Video scrubbing mechanism remains locked to center-crossings
        gsap.to(video, {
          currentTime: targetTime,
          ease: "power1.out",
          scrollTrigger: {
            trigger: section,
            start: "top center",   
            end: "bottom center",
            scrub: 1,
          }
        });

        // 2. NEW FIX: Single unified timeline for the text states
        // This tracks the section container through the entire viewport window
        const textTimeline = gsap.timeline({
          scrollTrigger: {
            trigger: section,
            start: "top bottom", // Starts tracking the moment text peeks from the bottom
            end: "bottom top",   // Stops tracking only when it fully exits the top
            scrub: true,         // Perfect 1:1 synchronization forward and backward
          }
        });

        // Set initial invisible state explicitly
        gsap.set(section, { opacity: 0, y: 40 });

        textTimeline
          // Step A: Fade in and slide up to native center frame position
          .to(section, { opacity: 1, y: 0, duration: 2, ease: "power1.out" })
          
          // Step B: Structural hold space (keeps text solid while crossing the center screen)
          .to(section, { duration: 4 }) 
          
          // Step C: Fade out and slide up as it leaves toward the top ceiling
          .to(section, { opacity: 0, y: -40, duration: 2, ease: "power1.in" });
      });

    });
  </script>
</body>
</html>
